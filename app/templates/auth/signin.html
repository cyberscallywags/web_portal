{% extends "base.html" %}
{% block title %}Sign In - Cyber Scallywags{% endblock %}
{% block content %}
<style>
    @keyframes moveGrid {
        0% { transform: translate(0, 0); }
        100% { transform: translate(50px, 50px); }
    }

    @keyframes slideInUp {
        from {
            opacity: 0;
            transform: translateY(30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
    }

    /* Auth Page Layout */
    .auth-page {
        min-height: 100vh;
        background: linear-gradient(135deg, #4006a7 0%, #0e6abd 50%, #00B1B3 100%);
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
    }

    .auth-page::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-image: 
            linear-gradient(rgba(193, 228, 21, 0.03) 2px, transparent 2px),
            linear-gradient(90deg, rgba(193, 228, 21, 0.03) 2px, transparent 2px);
        background-size: 50px 50px;
        animation: moveGrid 3s linear infinite;
        pointer-events: none;
    }

    .auth-container {
        position: relative;
        z-index: 1;
        max-width: 450px;
        width: 100%;
    }

    .auth-card {
        background: #fff;
        border-radius: 25px;
        padding: 50px 40px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        animation: slideInUp 0.6s ease-out;
    }

    .auth-logo {
        text-align: center;
        margin-bottom: 30px;
    }

    .auth-logo h1 {
        font-size: 2rem;
        color: #4006a7;
        margin: 0 0 10px 0;
        font-weight: 700;
    }

    .auth-logo p {
        font-size: 1rem;
        color: #666;
        margin: 0;
    }

    .auth-icon {
        font-size: 3.5rem;
        margin-bottom: 20px;
        display: inline-block;
        animation: float 3s ease-in-out infinite;
    }

    .form-group {
        margin-bottom: 25px;
    }

    .form-label {
        display: block;
        color: #333;
        font-weight: 600;
        margin-bottom: 8px;
        font-size: 0.95rem;
    }

    .form-input {
        width: 100%;
        border: 2px solid #e0e0e0;
        border-radius: 12px;
        padding: 14px 18px;
        font-size: 1rem;
        transition: all 0.3s ease;
        box-sizing: border-box;
    }

    .form-input:focus {
        border-color: #C1E415;
        box-shadow: 0 0 0 3px rgba(193, 228, 21, 0.1);
        outline: none;
    }

    .form-checkbox {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 25px;
    }

    .form-checkbox input[type="checkbox"] {
        width: 18px;
        height: 18px;
        cursor: pointer;
    }

    .form-checkbox label {
        color: #555;
        font-size: 0.95rem;
        cursor: pointer;
    }

    .btn-auth {
        width: 100%;
        background: linear-gradient(135deg, #4006a7, #0e6abd);
        border: none;
        border-radius: 12px;
        padding: 16px;
        font-size: 1.1rem;
        font-weight: 600;
        color: #fff;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-bottom: 20px;
    }

    .btn-auth:hover {
        background: linear-gradient(135deg, #CC0084, #4006a7);
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(64, 6, 167, 0.4);
    }

    .auth-links {
        text-align: center;
        margin-top: 25px;
    }

    .auth-links a {
        color: #4006a7;
        text-decoration: none;
        font-weight: 600;
        transition: color 0.3s ease;
    }

    .auth-links a:hover {
        color: #0e6abd;
    }

    .auth-divider {
        text-align: center;
        margin: 20px 0;
        color: #999;
        font-size: 0.9rem;
    }

    .coming-soon-badge {
        display: inline-block;
        background: linear-gradient(135deg, #4006a7, #CC0084);
        color: #fff;
        padding: 10px 20px;
        border-radius: 20px;
        font-size: 0.9rem;
        font-weight: 600;
        margin-top: 15px;
    }

    /* Responsive */
    @media (max-width: 576px) {
        .auth-card {
            padding: 40px 25px;
        }

        .auth-logo h1 {
            font-size: 1.6rem;
        }
    }
</style>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const signinForm = document.getElementById('signinForm');
        const errorMessage = document.getElementById('errorMessage');

        signinForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            // Get form values
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;

            // Validate inputs
            if (!username || !password) {
                showError('Please enter both username and password');
                return;
            }

            // Disable submit button while processing
            const submitBtn = signinForm.querySelector('.btn-auth');
            const originalText = submitBtn.textContent;
            submitBtn.disabled = true;
            submitBtn.textContent = 'Signing in...';

            try {
                // Make API call to auth service on port 8001
                const response = await fetch('http://localhost:8001/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || 'Login failed. Please check your credentials.');
                }

                // Store the access token
                if (data.access_token) {
                    localStorage.setItem('access_token', data.access_token);
                    
                    // Store remember me preference if checked
                    if (remember) {
                        localStorage.setItem('remember_me', 'true');
                    }

                    // Optional: Store user info if provided
                    if (data.user) {
                        localStorage.setItem('user', JSON.stringify(data.user));
                    }

                    // Verify token and get user roles
                    try {
                        const verifyResponse = await fetch('http://localhost:8001/auth/me', {
                            method: 'GET',
                            headers: {
                                'Authorization': `Bearer ${data.access_token}`,
                                'Content-Type': 'application/json'
                            }
                        });

                        const verifyData = await verifyResponse.json();
                        
                        if (verifyResponse.ok && verifyData.roles) {
                            // TODO: change to redirect to landing page
                            console.log(verifyData.roles);
                        }
                    } catch (verifyError) {
                        console.error('Error verifying token:', verifyError);
                    }

                    // Redirect to dashboard or home page
                    // window.location.href = '/dashboard' || '/';
                } else {
                    throw new Error('No access token received');
                }

            } catch (error) {
                showError(error.message || 'An error occurred during sign in');
                console.error('Sign in error:', error);
            } finally {
                // Re-enable submit button
                submitBtn.disabled = false;
                submitBtn.textContent = originalText;
            }
        });

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            // Auto-hide error after 5 seconds
            setTimeout(() => {
                errorMessage.style.display = 'none';
            }, 5000);
        }
    });
</script>

<div class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <div class="auth-icon">🐺</div>
                <h1>Welcome Back</h1>
                <p>Sign in to continue to Cyber Scallywags</p>
            </div>

            <form id="signinForm" novalidate>
                <div class="form-group">
                    <label for="username" class="form-label">Username</label>
                    <input type="username" id="username" name="username" class="form-input" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" name="password" class="form-input" placeholder="Enter your password" required>
                </div>

                <div class="form-checkbox">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">Remember me</label>
                </div>

                <button type="submit" class="btn-auth">Sign In</button>

                <div id="errorMessage" style="display: none; color: #dc3545; padding: 12px; background: #f8d7da; border-radius: 8px; margin-bottom: 20px; text-align: center;"></div>

                <div class="auth-divider">or</div>

                <div class="auth-links">
                    <a href="/auth/forgot-password">Forgot Password?</a>
                </div>
            </form>

            <div class="auth-links">
                Don't have an account? <a href="/signup">Sign Up</a>
            </div>
        </div>
    </div>
</div>

{% endblock %}
